name: Siteyi yayınla

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  kur:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: npm

      - run: npm ci

      - name: Siteyi derle
        # GitHub Pages siteyi /portfolio altında yayınlıyor.
        # Kendi alan adına geçildiğinde bu satır kaldırılır.
        env:
          NEXT_PUBLIC_BASE_PATH: /portfolio
        run: npm run build

      - name: Jekyll işlemesini kapat
        run: touch out/.nojekyll

      - uses: actions/upload-pages-artifact@v4
        with:
          path: out

  yayinla:
    needs: kur
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - id: pages
        uses: actions/deploy-pages@v4
